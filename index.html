<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Simple Pong</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { --bg: #0b1220; --fg: #e6eef6; --accent: #39a7ff; }
    html,body { height:100%; margin:0; font-family:system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial; background:var(--bg); color:var(--fg); display:flex; align-items:center; justify-content:center; }
    .wrapper { text-align: center; }
    canvas { background: linear-gradient(180deg,#07101a 0%, #081823 100%); display:block; margin: 10px auto; border: 2px solid rgba(255,255,255,0.06); box-shadow: 0 8px 30px rgba(0,0,0,0.6); cursor: crosshair; }
    .hint { color: #9fb7d6; font-size: 14px; margin-top: 6px; }
    .scoreboard { font-size: 20px; color:var(--fg); margin-bottom:6px; }
    button { margin-left:8px; padding:6px 10px; border-radius:6px; border:none; background:var(--accent); color:white; cursor:pointer; }
    button:active{ transform:translateY(1px); }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="scoreboard" id="scoreboard">Player 0 — 0 Computer</div>
    <canvas id="game" width="800" height="500"></canvas>
    <div class="hint">Move left paddle with mouse or Arrow Up / Arrow Down. Press Space to pause. <button id="restart">Restart</button></div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreboardEl = document.getElementById('scoreboard');
    const restartBtn = document.getElementById('restart');

    const W = canvas.width;
    const H = canvas.height;

    // Game objects
    const paddleWidth = 12;
    const paddleHeight = 110;
    const paddleSpeed = 6;
    const aiSpeed = 4.0;

    const ballRadius = 8;
    const initialBallSpeed = 5;

    let leftScore = 0;
    let rightScore = 0;

    let paused = false;

    const leftPaddle = {
      x: 12,
      y: (H - paddleHeight) / 2,
      w: paddleWidth,
      h: paddleHeight,
      vy: 0
    };

    const rightPaddle = {
      x: W - paddleWidth - 12,
      y: (H - paddleHeight) / 2,
      w: paddleWidth,
      h: paddleHeight,
      vy: 0
    };

    const ball = {
      x: W / 2,
      y: H / 2,
      vx: initialBallSpeed * (Math.random() > 0.5 ? 1 : -1),
      vy: (Math.random() * 4 - 2)
    };

    // Input
    const keys = { ArrowUp:false, ArrowDown:false };
    let lastMouseY = null;

    // Helpers
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

    function resetBall(direction = (Math.random() > 0.5 ? 1 : -1)) {
      ball.x = W / 2;
      ball.y = H / 2;
      // small random vertical velocity
      const ang = (Math.random() * 0.6 - 0.3); // radians-ish influence
      ball.vx = initialBallSpeed * direction;
      ball.vy = initialBallSpeed * ang;
    }

    function drawNet() {
      ctx.save();
      ctx.strokeStyle = "rgba(255,255,255,0.06)";
      ctx.setLineDash([10, 10]);
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(W / 2, 0);
      ctx.lineTo(W / 2, H);
      ctx.stroke();
      ctx.restore();
    }

    function draw() {
      // background
      ctx.clearRect(0,0,W,H);

      // Net
      drawNet();

      // Paddles
      ctx.fillStyle = '#e6eef6';
      ctx.fillRect(leftPaddle.x, leftPaddle.y, leftPaddle.w, leftPaddle.h);
      ctx.fillRect(rightPaddle.x, rightPaddle.y, rightPaddle.w, rightPaddle.h);

      // Ball
      ctx.fillStyle = '#39a7ff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ballRadius, 0, Math.PI * 2);
      ctx.fill();

      // Score text
      ctx.fillStyle = '#cfe9ff';
      ctx.font = '28px system-ui,Segoe UI,Roboto,Arial';
      ctx.textAlign = 'center';
      ctx.fillText(leftScore, W * 0.25, 40);
      ctx.fillText(rightScore, W * 0.75, 40);
    }

    function update() {
      if (paused) return;

      // Left paddle movement: mouse absolute position (if available) and key-based movement
      if (lastMouseY !== null) {
        // center paddle on mouse
        leftPaddle.y = clamp(lastMouseY - leftPaddle.h / 2, 0, H - leftPaddle.h);
      }
      if (keys.ArrowUp) leftPaddle.y = clamp(leftPaddle.y - paddleSpeed, 0, H - leftPaddle.h);
      if (keys.ArrowDown) leftPaddle.y = clamp(leftPaddle.y + paddleSpeed, 0, H - leftPaddle.h);

      // Right paddle AI: follow ball with limited speed
      const rightCenter = rightPaddle.y + rightPaddle.h / 2;
      const diff = ball.y - rightCenter;
      if (Math.abs(diff) > aiSpeed) {
        rightPaddle.y += Math.sign(diff) * aiSpeed;
      } else {
        rightPaddle.y += diff;
      }
      // clamp
      rightPaddle.y = clamp(rightPaddle.y, 0, H - rightPaddle.h);

      // Move ball
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Wall collisions (top/bottom)
      if (ball.y - ballRadius <= 0) {
        ball.y = ballRadius;
        ball.vy *= -1;
      } else if (ball.y + ballRadius >= H) {
        ball.y = H - ballRadius;
        ball.vy *= -1;
      }

      // Paddle collisions
      // Left paddle
      if (ball.x - ballRadius <= leftPaddle.x + leftPaddle.w) {
        if (ball.y >= leftPaddle.y && ball.y <= leftPaddle.y + leftPaddle.h) {
          // hit
          ball.x = leftPaddle.x + leftPaddle.w + ballRadius; // prevent sticking
          // reflect and add spin based on where we hit the paddle
          const rel = (ball.y - (leftPaddle.y + leftPaddle.h / 2)) / (leftPaddle.h / 2); // -1..1
          const bounceAngle = rel * Math.PI / 3; // up to 60 degrees
          const speed = Math.min(Math.hypot(ball.vx, ball.vy) * 1.05, 14); // slightly increase speed
          ball.vx = Math.abs(speed * Math.cos(bounceAngle));
          ball.vy = speed * Math.sin(bounceAngle);
        }
      }

      // Right paddle
      if (ball.x + ballRadius >= rightPaddle.x) {
        if (ball.y >= rightPaddle.y && ball.y <= rightPaddle.y + rightPaddle.h) {
          ball.x = rightPaddle.x - ballRadius;
          const rel = (ball.y - (rightPaddle.y + rightPaddle.h / 2)) / (rightPaddle.h / 2);
          const bounceAngle = rel * Math.PI / 3;
          const speed = Math.min(Math.hypot(ball.vx, ball.vy) * 1.05, 14);
          ball.vx = -Math.abs(speed * Math.cos(bounceAngle));
          ball.vy = speed * Math.sin(bounceAngle);
        }
      }

      // Scoring
      if (ball.x < -ballRadius) {
        // right scores
        rightScore++;
        updateScoreboard();
        resetBall(1); // ball moves right
      } else if (ball.x > W + ballRadius) {
        leftScore++;
        updateScoreboard();
        resetBall(-1);
      }
    }

    function updateScoreboard() {
      scoreboardEl.textContent = `Player ${leftScore} — ${rightScore} Computer`;
    }

    // Main loop
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // Input handlers
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      lastMouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
    });

    canvas.addEventListener('mouseleave', () => {
      // stop mouse control when leaving canvas, but keep keys working
      lastMouseY = null;
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.code === 'Space') {
        paused = !paused;
        e.preventDefault();
        return;
      }
      if (e.key === 'ArrowUp' || e.key === 'Up') keys.ArrowUp = true;
      if (e.key === 'ArrowDown' || e.key === 'Down') keys.ArrowDown = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'Up') keys.ArrowUp = false;
      if (e.key === 'ArrowDown' || e.key === 'Down') keys.ArrowDown = false;
    });

    restartBtn.addEventListener('click', () => {
      leftScore = 0;
      rightScore = 0;
      updateScoreboard();
      resetBall((Math.random() > 0.5) ? 1 : -1);
      paused = false;
    });

    // Start
    updateScoreboard();
    resetBall((Math.random() > 0.5) ? 1 : -1);
    requestAnimationFrame(loop);

    // Optional: support resizing while keeping canvas size (kept static here for simplicity)
  </script>
</body>
</html>
